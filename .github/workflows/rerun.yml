name: Rerun flaky jobs

on:
  workflow_run:
    workflows: ["build"]
    types:
      - completed

jobs:
  rerun:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    permissions:
      contents: read
      actions: write
    steps:
      - uses: k1LoW/rerun-action@85ba44f881d5df53dfd4afa44bca2b509b940904 # v1.3.0
        with:
          run_id: ${{ github.event.workflow_run.id }}
          pattern: 'Check failed: ThreadCache::IsValid'
          job: |
            Test
            Check race
          max_attempts: 10
